name: ci
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional go test -run regexp; empty runs the full suite"
        required: false
        default: ""
env:
  # Default version of Go to use by CI workflows. This should be the latest
  # release of Go; developers likely use the latest release in development and
  # we want to catch any bugs (e.g. lint errors, race detection) with this
  # release before they are merged. The Go compatibility guarantees ensure
  # backwards compatibility with the previous two minor releases and we
  # explicitly test our code for these versions so keeping this at prior
  # versions does not add value.
  DEFAULT_GO_VERSION: "~1.23.0"
jobs:
  lint:
    # Disabled on the seal fork: runs no tests. Its `make lint` (go mod tidy) +
    # check-clean-work-tree would rewrite go.mod `// indirect` markers that the
    # sealed build keeps byte-identical to the public v0.8.0 module.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 ## Needed for "Set internal/tools/go.mod timestamp" step.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Tools cache
        uses: actions/cache@v4
        env:
          cache-name: go-tools-cache
        with:
          path: .tools
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('./internal/tools/**') }}
      # The step below is needed to not rebuild all the build tools.
      - name: Set internal/tools/go.mod timestamp
        run: |
          filename="internal/tools/go.mod"
          unixtime=$(git log -1 --format="%at" -- "${filename}")
          touchtime=$(date -d @$unixtime +'%Y%m%d%H%M.%S')
          touch -t ${touchtime} "${filename}"
          ls -la --time-style=full-iso "${filename}"
      - name: Generate
        run: make generate
      - name: Run linters
        run: make license-check lint vanity-import-check verify-readmes verify-mods
      - name: Build
        run: make build
      - name: Check clean repository
        run: make check-clean-work-tree
  test-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Environment
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Run benchmarks to check functionality
        run: make test-bench

  test-race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Run tests with race detector
        run: |
          status=0
          if [ -n "${{ inputs.test-filter }}" ]; then
            (cd sdk/log && go test -v -race -run '${{ inputs.test-filter }}' ./...) 2>&1 | tee "$RUNNER_TEMP/test-race.log" || status=$?
          else
            make test-verbose 2>&1 | tee "$RUNNER_TEMP/test-race.log" || status=$?
          fi
          awk '/^[[:space:]]*--- PASS/{p++} /^[[:space:]]*--- FAIL/{f++} /^[[:space:]]*--- SKIP/{s++} END{printf "TEST SUMMARY: %d passed, %d failed, %d skipped\n", p, f, s}' "$RUNNER_TEMP/test-race.log"
          echo "SKIPPED TESTS (name: t.Skip reason):"
          awk '/^=== (RUN|NAME|CONT)/{cur=$3} /^[[:space:]]+[^[:space:]]+_test\.go:[0-9]+:/{sub(/^[[:space:]]+/, ""); msg[cur]=msg[cur] " " $0} /^[[:space:]]*--- SKIP: /{print "  SKIP " $3 ":" msg[$3]}' "$RUNNER_TEMP/test-race.log"
          exit $status

  test-concurrent-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Run ConcurrentSafe tests multiple times with race detector
        run: make test-concurrent-safe

  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Run coverage tests
        run: make test-coverage
      - name: Store coverage test output
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts-${{ env.DEFAULT_GO_VERSION }}
          path: coverage.txt

  codecov:
    # Disabled on the seal fork: coverage upload only (runs no tests) and needs
    # the upstream repository's Codecov upload token.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test-coverage]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-artifacts-${{ env.DEFAULT_GO_VERSION }}
      - name: Upload coverage report
        uses: codecov/codecov-action@v4.6.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          file: ./coverage.txt
          verbose: true

  compatibility-test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23.0", "~1.22.5"]
        platform:
          - os: ubuntu-latest
            arch: "386"
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: macos-latest
            arch: amd64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: "386"
          - os: windows-latest
            arch: amd64
        # Go 1.22's linker omits LC_UUID; current macos-latest dyld aborts every
        # test binary it builds ("missing LC_UUID load command"), so macOS runs on 1.23 only.
        exclude:
          - go-version: "~1.22.5"
            platform:
              os: macos-latest
              arch: amd64
          - go-version: "~1.22.5"
            platform:
              os: macos-latest
              arch: arm64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Run tests
        env:
          GOARCH: ${{ matrix.platform.arch }}
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            cd sdk/log && go test -short -v -run '${{ inputs.test-filter }}' ./...
          else
            make test-short
          fi

  test-compatibility:
    runs-on: ubuntu-latest
    needs: [compatibility-test]
    if: always()
    timeout-minutes: 45
    steps:
      - name: Test if compatibility-test passed
        run: |
          echo ${{ needs.compatibility-test.result }}
          test ${{ needs.compatibility-test.result }} == "success"

  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Build module zip
        run: |
          MOD_DIR="$GITHUB_WORKSPACE/sdk/log"
          MOD_PATH=go.opentelemetry.io/otel/sdk/log
          MOD_VERSION=v0.8.0
          # proxy.golang.org submodule zips carry the repository-root LICENSE
          cp "$GITHUB_WORKSPACE/LICENSE" "$MOD_DIR/LICENSE"
          HELPER="$RUNNER_TEMP/modzip"
          OUT="$RUNNER_TEMP/modzip-out"
          mkdir -p "$HELPER" "$OUT"
          cat > "$HELPER/go.mod" <<'EOF'
          module example.com/modzip

          go 1.23.0
          EOF
          cat > "$HELPER/main.go" <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              f, err := os.Create(os.Args[3])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, module.Version{Path: os.Args[1], Version: os.Args[2]}, os.Args[4]); err != nil {
                  log.Fatal(err)
              }
          }
          EOF
          cd "$HELPER"
          go get golang.org/x/mod@v0.24.0
          go run . "$MOD_PATH" "$MOD_VERSION" "$OUT/$MOD_VERSION.zip" "$MOD_DIR"
          rm "$MOD_DIR/LICENSE"
          unzip -l "$OUT/$MOD_VERSION.zip"
      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/modzip-out/v0.8.0.zip
          if-no-files-found: error
